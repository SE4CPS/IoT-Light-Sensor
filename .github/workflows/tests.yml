name: CI Pipeline

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

permissions: 
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dashboard deps
        run: pip install -r dashboard/requirements.txt

      - name: Install twin deps
        run: pip install -r twin/requirements.txt

      - name: Install pytest
        run: pip install pytest

      - name: Run dashboard tests
        run: pytest dashboard/tests/

      - name: Run twin tests
        run: pytest twin/test_twin_sim.py