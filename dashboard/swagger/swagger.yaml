openapi: 3.0.3
info:
  title: IoT Light Sensor API
  version: 1.0.0

servers:
  - url: https://iot-light-sensoruop.onrender.com
    description: Production
  # - url: http://127.0.0.1:5001
  #   description: Local

tags:
  # - name: Dashboard
  - name: Sensors
  - name: Usage Statistics
  - name: Room Management
  - name: Admin & Logging

paths:
  # /:
  #   get:
  #     tags: [Dashboard]
  #     summary: Dashboard home
  #     responses:
  #       '200':
  #         description: OK

  # /diagram:
  #   get:
  #     tags: [Dashboard]
  #     summary: System diagram
  #     responses:
  #       '200':
  #         description: OK

  /api/sensor:
    get:
      tags: [Sensors]
      summary: Get current sensor
      responses:
        '200':
          description: OK

  /api/v1/sensors/register:
    post:
      tags: [Sensors]
      summary: Register sensor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
        '500':
          description: Failed to register

  /api/v1/sensors/data:
    post:
      tags: [Sensors]
      summary: Submit reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lux]
              properties:
                sensor_id:
                  type: string
                lux:
                  type: number
      responses:
        '200':
          description: OK
        '400':
          description: Missing lux value
        '503':
          description: MongoDB not available
        '500':
          description: Failed to submit reading

  /api/v1/sensors/{sensor_id}/status:
    get:
      tags: [Sensors]
      summary: Get sensor status
      parameters:
        - name: sensor_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: No data for sensor

  /api/v1/sensors/latest:
    get:
      tags: [Sensors]
      summary: Get latest
      responses:
        '200':
          description: OK
        '404':
          description: No readings found
        '503':
          description: MongoDB not available
        '500':
          description: Failed to fetch latest reading

  /api/usage/reset:
    post:
      tags: [Usage Statistics]
      summary: Reset usage
      responses:
        '200':
          description: OK

  /api/usage/save:
    post:
      tags: [Usage Statistics]
      summary: Save usage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                onSeconds:
                  type: integer
                sensor_id:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid data

  /api/usage/{date}:
    get:
      tags: [Usage Statistics]
      summary: Get usage
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /api/usage/statistics:
    get:
      tags: [Usage Statistics]
      summary: Get statistics
      responses:
        '200':
          description: OK

  /api/room/{room_name}/save:
    post:
      tags: [Room Management]
      summary: Save room
      parameters:
        - name: room_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                onSeconds:
                  type: integer
                avgLux:
                  type: number
                sensor_id:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid room or invalid data

  /api/room/{room_name}/{date}:
    get:
      tags: [Room Management]
      summary: Get room
      parameters:
        - name: room_name
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid room

  /api/room/{room_name}/statistics:
    get:
      tags: [Room Management]
      summary: Room stats
      parameters:
        - name: room_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid room

  /api/rooms/all/{date}:
    get:
      tags: [Room Management]
      summary: All rooms
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /api/rooms/reset:
    post:
      tags: [Room Management]
      summary: Reset rooms
      responses:
        '200':
          description: OK

  /api/admin/access:
    post:
      tags: [Admin & Logging]
      summary: Admin access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                loginType:
                  type: string
                organizationName:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Missing required fields
        '503':
          description: MongoDB not available
        '500':
          description: Failed to log admin access

  /api/alerts:
    post:
      tags: [Admin & Logging]
      summary: Create alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                room_id:
                  type: string
                durationSeconds:
                  type: integer
                type:
                  type: string
                date:
                  type: string
      responses:
        '200':
          description: OK
        '503':
          description: MongoDB not available
        '500':
          description: Failed to create alert

  /api/user/login:
    post:
      tags: [Admin & Logging]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid email or password missing
        '401':
          description: Invalid password
        '503':
          description: MongoDB not available
        '500':
          description: Login failed

  /api/feedback:
    post:
      tags: [Admin & Logging]
      summary: Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Feedback text is required
        '503':
          description: MongoDB not available
        '500':
          description: Failed to save feedback

  /api/device/log:
    post:
      tags: [Admin & Logging]
      summary: Device log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action_type:
                  type: string
                room_id:
                  type: string
                room_name:
                  type: string
      responses:
        '200':
          description: OK
        '503':
          description: MongoDB not available
        '500':
          description: Failed to log device